server {
    listen 8088;
    server_name _;
    root /usr/share/nginx/html;

    location = /health {
        default_type application/json;
        add_header Cache-Control no-store;
        return 200 '{"ok":true,"game":"quake4-wasm","status":"native-only-gated"}';
    }

    location /data/ {
        alias /data/;
        add_header Cache-Control no-store;
    }
}
